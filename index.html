<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>To-Do List</h1>
  <p class="sub" id="count"></p>
  <div class="add">
    <input type="text" id="new" placeholder="Add a new task" maxlength="200" aria-label="New task">
    <button class="primary" id="addBtn">Add task</button>
  </div>
  <div class="filters" id="filters">
    <button data-f="all" class="on" aria-pressed="true">All</button>
    <button data-f="active" aria-pressed="false">Active</button>
    <button data-f="done" aria-pressed="false">Completed</button>
  </div>
  <div id="list"></div>
  <div class="foot"><span></span><button id="clear">Clear completed</button></div>
</main>
<script src="script.js"></script>
</body>
</html>
